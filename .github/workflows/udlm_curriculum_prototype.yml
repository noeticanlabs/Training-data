name: UDLM curriculum prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/udlm_curriculum_prototype.yml'
      - 'udlm_source_text/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout training archive
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyTorch
        run: python -m pip install --upgrade pip torch

      - name: Build clean UTF-8 curriculum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf udlm_curriculum
          mkdir -p udlm_curriculum/00_language udlm_curriculum/10_doctrine

          # Deliberately exclude root *.dat files. They are binary containers,
          # not raw UTF-8 language, and caused the previous null-byte attractor.
          cp udlm_source_text/Fundamentals_of_Language_Reference.md \
             udlm_curriculum/00_language/00_fundamentals_of_language.md
          cp README.md udlm_curriculum/10_doctrine/10_training_data_readme.md
          cp docs/DATA_ARCHITECTURE.md udlm_curriculum/10_doctrine/20_data_architecture.md
          cp docs/RESEARCH_GRAPH.md udlm_curriculum/10_doctrine/30_research_graph.md

          python - <<'PY'
          from pathlib import Path
          total = 0
          for p in sorted(Path('udlm_curriculum').rglob('*')):
              if not p.is_file():
                  continue
              raw = p.read_bytes()
              raw.decode('utf-8')
              if b'\x00' in raw:
                  raise SystemExit(f'NUL byte found in curriculum source: {p}')
              total += len(raw)
              print(f'{p}: {len(raw):,} bytes UTF-8 OK')
          print(f'clean curriculum bytes={total:,}')
          PY

      - name: Train persistent UDLM checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m udlm.run_curriculum udlm_curriculum \
            --device cpu \
            --steps-per-file 200 \
            --batch-size 4 \
            --context 128 \
            --lr 0.0015 \
            --replay-ratio 0.35 \
            --replay-bytes 262144 \
            --max-replay-regression 0.20 \
            --lesson-tolerance 0.02 \
            --checkpoint artifacts/udlm_curriculum_prototype.pt \
            --receipts artifacts/udlm_curriculum_receipts.jsonl \
            --prompt 'The system ' \
            --max-new-bytes 128 \
            2>&1 | tee artifacts/training.log

      - name: Smoke-load checkpoint
        shell: bash
        run: |
          python - <<'PY' | tee artifacts/generation_smoke.txt
          import torch
          from udlm.model import UDLM, UDLMConfig
          payload = torch.load('artifacts/udlm_curriculum_prototype.pt', map_location='cpu')
          model = UDLM(UDLMConfig(**payload['config']))
          model.load_state_dict(payload['state_dict'])
          model.eval()
          for prompt in [b'The ', b'Language ', b'Memory ']:
              out = model.generate(prompt, max_new_bytes=128, greedy=True)
              print(prompt.decode('utf-8') + out.decode('utf-8', errors='replace'))
          PY

      - name: Write build manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, time
          root = pathlib.Path('artifacts')
          files = {}
          for p in sorted(root.iterdir()):
              if p.is_file():
                  files[p.name] = {
                      'bytes': p.stat().st_size,
                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                  }
          manifest = {
              'kind': 'udlm-working-prototype-build-v1',
              'engine_ref': 'vendored UDLM-v0.1 runtime in noeticanlabs/Training-data',
              'trainer': 'copilot-style-curriculum-v1',
              'curriculum_policy': 'clean UTF-8 only; binary .dat excluded',
              'built_at_unix': time.time(),
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY

      - name: Upload working prototype
        uses: actions/upload-artifact@v4
        with:
          name: udlm-curriculum-working-prototype
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
