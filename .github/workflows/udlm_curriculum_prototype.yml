name: UDLM curriculum prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/udlm_curriculum_prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout training archive
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyTorch
        run: python -m pip install --upgrade pip torch

      - name: Build governed starter curriculum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf udlm_curriculum
          mkdir -p udlm_curriculum/archive udlm_curriculum/doctrine
          mapfile -t files < <(find . -maxdepth 1 -type f -name '*.dat' | sort | head -n 12)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No .dat curriculum sources found' >&2
            exit 1
          fi
          i=0
          for f in "${files[@]}"; do
            i=$((i+1))
            cp "$f" "udlm_curriculum/archive/$(printf '%02d' "$i")_$(basename "$f").txt"
          done
          cp README.md udlm_curriculum/doctrine/training_data_readme.md
          find docs -maxdepth 2 -type f \( -name '*.md' -o -name '*.txt' \) -print0 2>/dev/null | sort -z | head -z -n 8 | while IFS= read -r -d '' f; do
            safe=$(echo "$f" | tr '/ ' '__')
            cp "$f" "udlm_curriculum/doctrine/${safe}"
          done
          echo "Curriculum files: $(find udlm_curriculum -type f | wc -l)"
          du -sh udlm_curriculum

      - name: Train persistent UDLM checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m udlm.run_curriculum udlm_curriculum \
            --device cpu \
            --steps-per-file 20 \
            --batch-size 4 \
            --context 96 \
            --lr 0.002 \
            --replay-ratio 0.25 \
            --replay-bytes 262144 \
            --max-replay-regression 0.10 \
            --lesson-tolerance 0.02 \
            --checkpoint artifacts/udlm_curriculum_prototype.pt \
            --receipts artifacts/udlm_curriculum_receipts.jsonl \
            --prompt 'The system ' \
            --max-new-bytes 128 \
            2>&1 | tee artifacts/training.log

      - name: Smoke-load checkpoint
        shell: bash
        run: |
          python - <<'PY' | tee artifacts/generation_smoke.txt
          import torch
          from udlm.model import UDLM, UDLMConfig
          payload = torch.load('artifacts/udlm_curriculum_prototype.pt', map_location='cpu')
          model = UDLM(UDLMConfig(**payload['config']))
          model.load_state_dict(payload['state_dict'])
          model.eval()
          out = model.generate(b'Memory ', max_new_bytes=128, greedy=True)
          print(out.decode('utf-8', errors='replace'))
          PY

      - name: Write build manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, time
          root = pathlib.Path('artifacts')
          files = {}
          for p in sorted(root.iterdir()):
              if p.is_file():
                  files[p.name] = {
                      'bytes': p.stat().st_size,
                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                  }
          manifest = {
              'kind': 'udlm-working-prototype-build-v1',
              'engine_ref': 'vendored UDLM-v0.1 runtime in noeticanlabs/Training-data',
              'trainer': 'copilot-style-curriculum-v1',
              'built_at_unix': time.time(),
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY

      - name: Upload working prototype
        uses: actions/upload-artifact@v4
        with:
          name: udlm-curriculum-working-prototype
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
