name: UDLM certified learning prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/udlm_curriculum_prototype.yml'
      - 'udlm/**'
      - 'udlm_source_text/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout training archive
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyTorch
        run: python -m pip install --upgrade pip torch

      - name: Build clean UTF-8 curriculum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf udlm_curriculum
          mkdir -p udlm_curriculum/00_language udlm_curriculum/10_doctrine
          cp udlm_source_text/Fundamentals_of_Language_Reference.md udlm_curriculum/00_language/00_fundamentals_of_language.md
          cp README.md udlm_curriculum/10_doctrine/10_training_data_readme.md
          cp docs/DATA_ARCHITECTURE.md udlm_curriculum/10_doctrine/20_data_architecture.md
          cp docs/RESEARCH_GRAPH.md udlm_curriculum/10_doctrine/30_research_graph.md
          python - <<'PY'
          from pathlib import Path
          total = 0
          for p in sorted(Path('udlm_curriculum').rglob('*')):
              if not p.is_file():
                  continue
              raw = p.read_bytes()
              raw.decode('utf-8')
              if b'\x00' in raw:
                  raise SystemExit(f'NUL byte found in curriculum source: {p}')
              total += len(raw)
              print(f'{p}: {len(raw):,} bytes UTF-8 OK')
          print(f'clean curriculum bytes={total:,}')
          PY

      - name: Run certified learning loop
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          python -m udlm.run_certified udlm_curriculum \
            --device cpu \
            --steps-per-file 200 \
            --batch-size 4 \
            --context 128 \
            --lr 0.0015 \
            --replay-ratio 0.35 \
            --replay-bytes 262144 \
            --validation-fraction 0.20 \
            --min-acquisition-gain 0.02 \
            --min-validation-gain 0.01 \
            --max-replay-regression 0.10 \
            --hard-replay-regression 0.25 \
            --max-generation-regression 0.12 \
            --rail-limit 0.90 \
            --checkpoint artifacts/udlm_certified.pt \
            --receipts artifacts/udlm_certified_receipts.jsonl \
            --capabilities artifacts/udlm_capability_memory.jsonl \
            --failures artifacts/udlm_failure_memory.jsonl \
            --held-dir artifacts/held_candidates \
            --report artifacts/udlm_certified_report.json \
            --max-new-bytes 128 \
            2>&1 | tee artifacts/training.log

      - name: Validate certified artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/udlm_certified.pt
          test -s artifacts/udlm_certified_receipts.jsonl
          test -s artifacts/udlm_certified_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/udlm_certified_report.json').read_text(encoding='utf-8'))
          print('canonical_model_hash=', report['canonical_model_hash'])
          print('counts=', report['counts'])
          for prompt, row in report['generation_panel'].items():
              print(f'{prompt!r}: {row["text"]!r}')
              print('  metrics=', row['metrics'])
              print('  X=', row['state']['x'])
              print('  R=', row['state']['r'])
          PY

      - name: Write build manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, time
          root = pathlib.Path('artifacts')
          files = {}
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  files[str(p.relative_to(root))] = {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
          manifest = {
              'kind': 'udlm-certified-learning-build-v1',
              'engine': 'UDLM-v0.1 payload/routing dynamics',
              'trainer': 'candidate -> challenge -> ADMIT/HOLD/REJECT -> diagnose -> receipt',
              'learning_boundary': 'weight update is a candidate; only admitted candidates become canonical',
              'repair_boundary': 'failure classification records continuation requirements; no unverified automatic architecture repair',
              'curriculum_policy': 'clean UTF-8 only; binary .dat excluded',
              'built_at_unix': time.time(),
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY

      - name: Upload certified prototype
        uses: actions/upload-artifact@v4
        with:
          name: udlm-certified-learning-prototype
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
