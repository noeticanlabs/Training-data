name: UDLM certified learning prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/udlm_curriculum_prototype.yml'
      - 'udlm/**'
      - 'udlm_source_text/**'
      - 'curriculum/udlm_v01/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout training archive
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU PyTorch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0

      - name: Compile and preflight certified machinery
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q udlm curriculum/udlm_v01
          python -m udlm.preflight

      - name: Build staged C0-C8 UTF-8 curriculum
        shell: bash
        run: |
          set -euo pipefail
          python curriculum/udlm_v01/build_staged_curriculum.py
          {
            printf '\n\nUDLM C8 domain expansion — academic language reference.\n\n'
            cat udlm_source_text/Fundamentals_of_Language_Reference.md
            printf '\n\nUDLM C8 domain expansion — governed training data.\n\n'
            cat README.md
            printf '\n\nUDLM C8 domain expansion — data architecture.\n\n'
            cat docs/DATA_ARCHITECTURE.md
            printf '\n\nUDLM C8 domain expansion — research graph.\n\n'
            cat docs/RESEARCH_GRAPH.md
          } >> udlm_curriculum/08_natural/08_natural.txt
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('udlm_curriculum').rglob('*.txt'))
          if len(files) != 9: raise SystemExit(f'expected exactly 9 C0-C8 stage files, found {len(files)}')
          total = 0; stages = []
          for p in files:
              raw = p.read_bytes(); raw.decode('utf-8')
              if b'\x00' in raw: raise SystemExit(f'NUL byte found in curriculum source: {p}')
              if len(raw) < 512: raise SystemExit(f'curriculum stage too short for holdout: {p}')
              total += len(raw); stages.append(p.parent.name); print(f'{p}: {len(raw):,} bytes UTF-8 OK')
          for i in range(9):
              if not any(s.startswith(f'{i:02d}_') for s in stages): raise SystemExit(f'missing curriculum stage C{i}')
          print(f'staged curriculum files={len(files)} bytes={total:,}')
          PY

      - name: Run stage-frozen certified lineage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts && mkdir -p artifacts
          python -m udlm.run_stage_frozen udlm_curriculum \
            --out artifacts/stage_frozen --device cpu --steps-per-stage 200 --batch-size 4 \
            --context 128 --lr 0.0015 --replay-ratio 0.35 --replay-bytes 262144 \
            --retention-bytes 262144 --validation-fraction 0.20 --min-acquisition-gain 0.02 \
            --min-validation-gain 0.01 --max-replay-regression 0.10 --hard-replay-regression 0.25 \
            --max-generation-regression 0.12 --hard-generation-regression 0.20 --rail-limit 0.90 \
            --max-new-bytes 128 2>&1 | tee artifacts/training.log

      - name: Automatically diagnose stopped lineage with RPAIR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from udlm.rpair_diagnose import write_stage_diagnosis
          root = Path('artifacts/stage_frozen'); summary = json.loads((root/'lineage_summary.json').read_text())
          if not summary.get('stopped'):
              print('RPAIR diagnosis: lineage did not stop'); raise SystemExit(0)
          stage = summary['last_stage']
          path = write_stage_diagnosis(root, stage, context=128, validation_fraction=0.20,
              max_retention_regression=0.10, rail_limit=0.90, max_new_bytes=128, device_name='cpu')
          diagnosis = json.loads(path.read_text()); manifest_path = root/stage/'manifest.json'; manifest=json.loads(manifest_path.read_text())
          raw=path.read_bytes(); manifest['files']['rpair_diagnosis.json']={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          manifest['rpair_diagnosis']={'primary_fault':diagnosis['primary_fault'],'failure_class':diagnosis['failure_class'],'diagnostic_confidence':diagnosis['diagnostic_confidence']}
          manifest_path.write_text(json.dumps(manifest,indent=2,sort_keys=True))
          print('RPAIR primary_fault=', diagnosis['primary_fault']); print('RPAIR worst_affected=', diagnosis['worst_affected_certified_stage'])
          PY

      - name: Automatically rehearse bounded RPAIR replay repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          root=Path('artifacts/stage_frozen'); summary=json.loads((root/'lineage_summary.json').read_text())
          if not summary.get('stopped'): raise SystemExit(0)
          stage=summary['last_stage']; diagnosis=json.loads((root/stage/'rpair_diagnosis.json').read_text())
          if diagnosis.get('primary_fault')!='CERTIFIED_CAPABILITY_INTERFERENCE': raise SystemExit(0)
          subprocess.run([sys.executable,'-m','udlm.rpair_repair',str(root),stage,'--context','128','--validation-fraction','0.20','--steps','200','--batch-size','4','--max-retention-regression','0.10','--max-generation-regression','0.12','--min-acquisition-gain','0.02','--min-validation-gain','0.01','--rail-limit','0.90','--max-new-bytes','128','--device','cpu'],check=True)
          p=root/stage/'rpair_repair_summary.json'; repair=json.loads(p.read_text()); mpath=root/stage/'manifest.json'; m=json.loads(mpath.read_text()); raw=p.read_bytes()
          m['files']['rpair_repair_summary.json']={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}; m['rpair_repair']={'trial_count':repair['trial_count'],'passing_trial_count':repair['passing_trial_count'],'best_trial_name':repair['best_trial']['name'],'best_trial_passes':repair['best_trial']['passes_all_gates']}; mpath.write_text(json.dumps(m,indent=2,sort_keys=True))
          print('RPAIR replay passing=',repair['passing_trial_count'],'best=',repair['best_trial']['name'])
          PY

      - name: Automatically rehearse importance-anchored RPAIR plasticity repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          root=Path('artifacts/stage_frozen'); summary=json.loads((root/'lineage_summary.json').read_text())
          if not summary.get('stopped'): raise SystemExit(0)
          stage=summary['last_stage']; diagnosis=json.loads((root/stage/'rpair_diagnosis.json').read_text())
          if diagnosis.get('primary_fault')!='CERTIFIED_CAPABILITY_INTERFERENCE': raise SystemExit(0)
          replay_path=root/stage/'rpair_repair_summary.json'; replay=json.loads(replay_path.read_text()) if replay_path.exists() else {'passing_trial_count':0}
          if replay.get('passing_trial_count',0)>0:
              print('RPAIR plasticity repair skipped: replay already produced a passing candidate'); raise SystemExit(0)
          subprocess.run([sys.executable,'-m','udlm.rpair_plasticity_repair',str(root),stage,'--context','128','--validation-fraction','0.20','--steps','200','--batch-size','4','--importance-batches','8','--max-retention-regression','0.10','--max-generation-regression','0.12','--min-acquisition-gain','0.02','--min-validation-gain','0.01','--rail-limit','0.90','--max-new-bytes','128','--device','cpu'],check=True)
          p=root/stage/'rpair_plasticity_repair_summary.json'; repair=json.loads(p.read_text()); mpath=root/stage/'manifest.json'; m=json.loads(mpath.read_text()); raw=p.read_bytes()
          m['files']['rpair_plasticity_repair_summary.json']={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}; m['rpair_plasticity_repair']={'trial_count':repair['trial_count'],'passing_trial_count':repair['passing_trial_count'],'best_trial_name':repair['best_trial']['name'],'best_trial_passes':repair['best_trial']['passes_all_gates'],'mechanism':repair['mechanism']}; mpath.write_text(json.dumps(m,indent=2,sort_keys=True))
          print('RPAIR plasticity passing=',repair['passing_trial_count']); print('RPAIR plasticity best=',repair['best_trial']['name']); print('RPAIR plasticity best_retention=',repair['best_trial']['worst_retention'])
          PY

      - name: Map gradient interference geometry with RPAIR tomography
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          root=Path('artifacts/stage_frozen'); summary=json.loads((root/'lineage_summary.json').read_text())
          if not summary.get('stopped'): raise SystemExit(0)
          stage=summary['last_stage']
          subprocess.run([sys.executable,'-m','udlm.rpair_interference_tomography',str(root),stage,'--context','128','--validation-fraction','0.20','--batches','8','--batch-size','4','--device','cpu'],check=True)
          p=root/stage/'rpair_interference_tomography.json'; t=json.loads(p.read_text()); mpath=root/stage/'manifest.json'; m=json.loads(mpath.read_text()); raw=p.read_bytes()
          m['files']['rpair_interference_tomography.json']={'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          m['rpair_interference_tomography']={'worst_global_conflict_stage':t['worst_global_conflict_stage'],'worst_global_cosine':t['worst_global_cosine'],'families_with_conflicts':sorted(t['families_with_conflicts'])}
          mpath.write_text(json.dumps(m,indent=2,sort_keys=True))
          print('RPAIR tomography worst_stage=',t['worst_global_conflict_stage'])
          print('RPAIR tomography worst_cosine=',t['worst_global_cosine'])
          print('RPAIR tomography conflict_families=',sorted(t['families_with_conflicts']))
          PY

      - name: Validate frozen stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/stage_frozen/lineage_summary.json
          test -s artifacts/stage_frozen/lineage_receipts.jsonl
          test -s artifacts/stage_frozen/latest_certified.pt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import torch
          from udlm.model import UDLM,UDLMConfig
          from udlm.run_certified import model_hash,validate_receipt_chain
          root=Path('artifacts/stage_frozen'); summary=json.loads((root/'lineage_summary.json').read_text()); tail=validate_receipt_chain(root/'lineage_receipts.jsonl')
          if tail!=summary['last_receipt_hash']: raise SystemExit('lineage receipt tail mismatch')
          payload=torch.load(root/'latest_certified.pt',map_location='cpu'); model=UDLM(UDLMConfig(**payload['config'])); model.load_state_dict(payload['state_dict'])
          if model_hash(model)!=summary['final_canonical_model_hash']: raise SystemExit('latest certified checkpoint hash mismatch')
          for row in summary['lineage']:
              stage=row['stage']; d=root/stage
              for name in ('parent.pt','candidate.pt','canonical.pt','curriculum.txt','report.json','receipt.json','manifest.json'):
                  if not (d/name).is_file(): raise SystemExit(f'{stage}: missing {name}')
              if row['decision']!='ADMIT' and not (d/'rpair_diagnosis.json').is_file(): raise SystemExit(f'{stage}: stopped stage missing RPAIR diagnosis')
              manifest=json.loads((d/'manifest.json').read_text())
              for name,meta in manifest['files'].items():
                  p=d/name
                  if hashlib.sha256(p.read_bytes()).hexdigest()!=meta['sha256']: raise SystemExit(f'{stage}: SHA mismatch for {name}')
              print(stage,row['decision'],row['canonical_model_hash'])
          print('final_canonical_model_hash=',summary['final_canonical_model_hash'])
          PY

      - name: Write build manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,time
          root=pathlib.Path('artifacts'); root.mkdir(parents=True,exist_ok=True); files={}
          for p in sorted(root.rglob('*')):
              if p.is_file(): files[str(p.relative_to(root))]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          manifest={'kind':'udlm-certified-stage-frozen-build-v5-rpair-interference-tomography','engine':'UDLM-v0.1 homeostatic payload/routing dynamics','training_policy':'C0-C8 stage-frozen certified curriculum','progression_policy':'next stage only after ADMIT','rpair_policy':'diagnose -> replay repair -> plasticity repair -> gradient interference tomography; no automatic promotion','validation_semantics':'heldout bytes are evaluation-only','git_sha':os.environ.get('GITHUB_SHA'),'built_at_unix':time.time(),'files':files}
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY

      - name: Upload stage-frozen certified lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udlm-stage-frozen-certified-lineage
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
