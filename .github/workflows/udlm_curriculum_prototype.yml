name: UDLM certified learning prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/udlm_curriculum_prototype.yml'
      - 'udlm/**'
      - 'udlm_source_text/**'
      - 'curriculum/udlm_v01/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout training archive
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU PyTorch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0

      - name: Compile and preflight certified machinery
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q udlm curriculum/udlm_v01
          python -m udlm.preflight

      - name: Build staged C0-C8 UTF-8 curriculum
        shell: bash
        run: |
          set -euo pipefail
          python curriculum/udlm_v01/build_staged_curriculum.py
          {
            printf '\n\nUDLM C8 domain expansion — academic language reference.\n\n'
            cat udlm_source_text/Fundamentals_of_Language_Reference.md
            printf '\n\nUDLM C8 domain expansion — governed training data.\n\n'
            cat README.md
            printf '\n\nUDLM C8 domain expansion — data architecture.\n\n'
            cat docs/DATA_ARCHITECTURE.md
            printf '\n\nUDLM C8 domain expansion — research graph.\n\n'
            cat docs/RESEARCH_GRAPH.md
          } >> udlm_curriculum/08_natural/08_natural.txt
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('udlm_curriculum').rglob('*.txt'))
          if len(files) != 9:
              raise SystemExit(f'expected exactly 9 C0-C8 stage files, found {len(files)}')
          total = 0
          stages = []
          for p in files:
              raw = p.read_bytes(); raw.decode('utf-8')
              if b'\x00' in raw:
                  raise SystemExit(f'NUL byte found in curriculum source: {p}')
              if len(raw) < 512:
                  raise SystemExit(f'curriculum stage too short for holdout: {p}')
              total += len(raw); stages.append(p.parent.name)
              print(f'{p}: {len(raw):,} bytes UTF-8 OK')
          for i in range(9):
              if not any(s.startswith(f'{i:02d}_') for s in stages):
                  raise SystemExit(f'missing curriculum stage C{i}')
          print(f'staged curriculum files={len(files)} bytes={total:,}')
          PY

      - name: Run stage-frozen certified lineage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          python -m udlm.run_stage_frozen udlm_curriculum \
            --out artifacts/stage_frozen \
            --device cpu \
            --steps-per-stage 200 \
            --batch-size 4 \
            --context 128 \
            --lr 0.0015 \
            --replay-ratio 0.35 \
            --replay-bytes 262144 \
            --retention-bytes 262144 \
            --validation-fraction 0.20 \
            --min-acquisition-gain 0.02 \
            --min-validation-gain 0.01 \
            --max-replay-regression 0.10 \
            --hard-replay-regression 0.25 \
            --max-generation-regression 0.12 \
            --hard-generation-regression 0.20 \
            --rail-limit 0.90 \
            --max-new-bytes 128 \
            2>&1 | tee artifacts/training.log

      - name: Automatically diagnose stopped lineage with RPAIR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from udlm.rpair_diagnose import write_stage_diagnosis

          root = Path('artifacts/stage_frozen')
          summary = json.loads((root / 'lineage_summary.json').read_text(encoding='utf-8'))
          if not summary.get('stopped'):
              print('RPAIR diagnosis: lineage did not stop; no failed stage to diagnose')
              raise SystemExit(0)

          stage = summary['last_stage']
          path = write_stage_diagnosis(
              root,
              stage,
              context=128,
              validation_fraction=0.20,
              max_retention_regression=0.10,
              rail_limit=0.90,
              max_new_bytes=128,
              device_name='cpu',
          )
          diagnosis = json.loads(path.read_text(encoding='utf-8'))

          # Bind the diagnosis into the frozen stage artifact manifest.
          manifest_path = root / stage / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          raw = path.read_bytes()
          manifest['files']['rpair_diagnosis.json'] = {
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
          }
          manifest['rpair_diagnosis'] = {
              'primary_fault': diagnosis['primary_fault'],
              'failure_class': diagnosis['failure_class'],
              'diagnostic_confidence': diagnosis['diagnostic_confidence'],
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False, sort_keys=True), encoding='utf-8')

          print('RPAIR failed_stage=', stage)
          print('RPAIR failure_class=', diagnosis['failure_class'])
          print('RPAIR primary_fault=', diagnosis['primary_fault'])
          print('RPAIR confidence=', diagnosis['diagnostic_confidence'])
          print('RPAIR worst_affected=', diagnosis['worst_affected_certified_stage'])
          print('RPAIR continuation_requirement=', diagnosis['continuation_requirement'])
          PY

      - name: Validate frozen stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/stage_frozen/lineage_summary.json
          test -s artifacts/stage_frozen/lineage_receipts.jsonl
          test -s artifacts/stage_frozen/latest_certified.pt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import torch
          from udlm.model import UDLM, UDLMConfig
          from udlm.run_certified import model_hash, validate_receipt_chain

          root = Path('artifacts/stage_frozen')
          summary = json.loads((root / 'lineage_summary.json').read_text(encoding='utf-8'))
          tail = validate_receipt_chain(root / 'lineage_receipts.jsonl')
          if tail != summary['last_receipt_hash']:
              raise SystemExit('lineage receipt tail mismatch')
          payload = torch.load(root / 'latest_certified.pt', map_location='cpu')
          model = UDLM(UDLMConfig(**payload['config']))
          model.load_state_dict(payload['state_dict'])
          if model_hash(model) != summary['final_canonical_model_hash']:
              raise SystemExit('latest certified checkpoint hash mismatch')
          for row in summary['lineage']:
              stage = row['stage']; d = root / stage
              for name in ('parent.pt','candidate.pt','canonical.pt','curriculum.txt','report.json','receipt.json','manifest.json'):
                  if not (d / name).is_file():
                      raise SystemExit(f'{stage}: missing {name}')
              if row['decision'] != 'ADMIT' and not (d / 'rpair_diagnosis.json').is_file():
                  raise SystemExit(f'{stage}: stopped stage missing automatic RPAIR diagnosis')
              manifest = json.loads((d / 'manifest.json').read_text(encoding='utf-8'))
              for name, meta in manifest['files'].items():
                  p = d / name
                  if hashlib.sha256(p.read_bytes()).hexdigest() != meta['sha256']:
                      raise SystemExit(f'{stage}: SHA mismatch for {name}')
              print(stage, row['decision'], row['canonical_model_hash'])
          print('last_stage=', summary['last_stage'])
          print('last_decision=', summary['last_decision'])
          print('final_canonical_model_hash=', summary['final_canonical_model_hash'])
          print('last_receipt_hash=', summary['last_receipt_hash'])
          PY

      - name: Write build manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, time
          root = pathlib.Path('artifacts'); root.mkdir(parents=True, exist_ok=True)
          files = {}
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  files[str(p.relative_to(root))] = {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
          manifest = {
              'kind': 'udlm-certified-stage-frozen-build-v2-rpair-auto-diagnosis',
              'engine': 'UDLM-v0.1 homeostatic payload/routing dynamics',
              'training_policy': 'C0-C8 developmental curriculum; each executed stage freezes parent, candidate, canonical, receipt, report, curriculum and manifest',
              'progression_policy': 'next stage executes only after prior ADMIT; HOLD or REJECT stops lineage',
              'rpair_policy': 'every stopped lineage automatically receives an evidence-bounded RPAIR diagnosis before artifact validation; diagnosis has no mutation authority',
              'validation_semantics': 'disjoint within-source heldout bytes excluded from replay training',
              'git_sha': os.environ.get('GITHUB_SHA'),
              'built_at_unix': time.time(),
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY

      - name: Upload stage-frozen certified lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udlm-stage-frozen-certified-lineage
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
