name: Torch Graph Governed Ingestion

on:
  pull_request:
    paths:
      - "ingest_torch_math_graph_v004.py"
      - "validate_torch_math_graph_v004.py"
      - "safe_torch_math_graph_loader.py"
      - "test_torch_math_graph_v004.py"
      - "config/torch_graph_ingestion_v001.json"
      - "schemas/torch_graph_*.schema.json"
      - ".github/workflows/torch-graph-governed-ingestion.yml"
  push:
    branches:
      - agent/torch-graph-governed-ingestion-v001

permissions:
  contents: read

jobs:
  fixture-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax
        run: |
          python -m py_compile ingest_torch_math_graph_v004.py validate_torch_math_graph_v004.py safe_torch_math_graph_loader.py test_torch_math_graph_v004.py
          python -m json.tool config/torch_graph_ingestion_v001.json >/dev/null
          python -m json.tool schemas/torch_graph_execution_mapping.schema.json >/dev/null
          python -m json.tool schemas/torch_graph_edge_sidecar.schema.json >/dev/null
          python -m json.tool schemas/torch_graph_gi_input.schema.json >/dev/null
      - name: Run deterministic fixtures
        run: python -m unittest -v test_torch_math_graph_v004.py
