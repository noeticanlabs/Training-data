name: Domain Registry

on:
  pull_request:
    paths:
      - "build_domain_indexes.py"
      - "validate_domain_indexes.py"
      - "validate_domain_calibration.py"
      - "analyze_domain_evidence.py"
      - "build_domain_validation_receipt.py"
      - "test_domain_registry.py"
      - "test_domain_evidence_analysis.py"
      - "config/domain_*.json"
      - "schemas/domain_assignment.schema.json"
      - "requirements*.txt"
      - "requirements.lock"
      - ".github/workflows/domain-registry.yml"
  push:
    branches:
      - main
      - domain-registry-v001

permissions:
  contents: read

jobs:
  fixture-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Check Python and JSON syntax
        run: |
          python -m py_compile build_domain_indexes.py validate_domain_indexes.py validate_domain_calibration.py analyze_domain_evidence.py build_domain_validation_receipt.py test_domain_registry.py test_domain_evidence_analysis.py
          python -m json.tool config/domain_registry.json >/dev/null
          python -m json.tool config/domain_rules.json >/dev/null
          python -m json.tool schemas/domain_assignment.schema.json >/dev/null
          python -m json.tool schemas/domain_validation_receipt.schema.json >/dev/null
      - name: Run deterministic regression suite
        run: python -m unittest -v test_domain_registry.py test_domain_evidence_analysis.py
