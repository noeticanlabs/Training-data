name: Governed Data Integrity

on:
  pull_request:
    paths:
      - "build_dual_databases.py"
      - "validate_databases.py"
      - "build_training_formats.py"
      - "validate_training_formats.py"
      - "validate_outputs.py"
      - "validate_research_graph.py"
      - "validate_artifact_manifest.py"
      - "test_*integrity.py"
      - "test_*governance.py"
      - "test_transcript_validation.py"
      - "test_artifact_manifest_integrity.py"
      - "_selftest_research_graph.py"
      - "config/research_graph.json"
      - "schemas/research_*.json"
      - "schemas/training_example.schema.json"
      - "schemas/source_artifact.schema.json"
      - "artifacts/manifest.json"
      - "file-*.dat"
      - "requirements*.txt"
      - "requirements.lock"
      - ".github/workflows/governed-integrity.yml"
  push:
    branches:
      - main
      - fix/governed-data-integrity-v001

permissions:
  contents: read

jobs:
  synthetic-integrity-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Check Python and JSON syntax
        run: |
          python -m py_compile build_dual_databases.py validate_databases.py build_training_formats.py validate_training_formats.py validate_outputs.py validate_research_graph.py validate_artifact_manifest.py _selftest_research_graph.py test_database_integrity.py test_training_format_governance.py test_transcript_validation.py test_research_graph_integrity.py test_artifact_manifest_integrity.py
          python -m json.tool config/research_graph.json >/dev/null
          python -m json.tool schemas/research_record.schema.json >/dev/null
          python -m json.tool schemas/training_example.schema.json >/dev/null
          python -m json.tool schemas/research_graph_node.schema.json >/dev/null
          python -m json.tool schemas/research_graph_relation.schema.json >/dev/null
          python -m json.tool schemas/source_artifact.schema.json >/dev/null
          python -m json.tool artifacts/manifest.json >/dev/null
      - name: Run synthetic mutation tests
        run: python -m unittest -v test_database_integrity.py test_training_format_governance.py test_transcript_validation.py test_research_graph_integrity.py test_artifact_manifest_integrity.py
      - name: Validate checked-in source artifacts
        run: python validate_artifact_manifest.py
      - name: Run graph functional self-test
        run: python _selftest_research_graph.py
