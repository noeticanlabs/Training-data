name: CF-LM Teacher-Data Bridge CI

on:
  push:
    branches:
      - agent/cflm-teacher-data-bridge-v001
  workflow_dispatch:

jobs:
  bridge-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bridge scripts
        run: python -m py_compile export_cflm_teacher_data_v001.py _selftest_cflm_teacher_data_v001.py
      - name: Run governed bridge self-test
        run: python _selftest_cflm_teacher_data_v001.py
