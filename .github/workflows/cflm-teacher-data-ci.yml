name: CF-LM Teacher-Data Bridge CI

on:
  push:
    branches:
      - agent/cflm-teacher-data-bridge-v001
  workflow_dispatch:

jobs:
  bridge-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Python runtime
        run: python3 --version
      - name: Compile bridge scripts
        run: python3 -m py_compile export_cflm_teacher_data_v001.py _selftest_cflm_teacher_data_v001.py
      - name: Run governed bridge self-test
        run: python3 _selftest_cflm_teacher_data_v001.py
